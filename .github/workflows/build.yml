name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o GameLiveBooster_HP_Build.zip -d build_project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: build_project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameLiveBooster-APK
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
